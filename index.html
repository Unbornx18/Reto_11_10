<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Estudiantes con Promesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Búsqueda de Estudiantes por ID</h1>
        <p class="subtitle">Utilizando Promesas, <code>.then()</code> y <code>.catch()</code></p>

        <div class="card">
            <div class="input-group">
                <label for="studentId">Ingrese el ID del estudiante (ej. 1, 2, 3 o 10):</label>
                <input type="number" id="studentId" placeholder="Ej. 2" min="1">
                <button id="searchBtn">Buscar Estudiante</button>
            </div>

            <div id="resultContainer" class="result-box hidden">
                <p id="resultText"></p>
            </div>
        </div>

        <div class="info-box">
            <h3>Estudiantes Disponibles en el Arreglo:</h3>
            <ul>
                <li>ID: 1 - Ana (20 años)</li>
                <li>ID: 2 - Juan (22 años)</li>
                <li>ID: 3 - María (21 años)</li>
            </ul>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
