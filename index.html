<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Estudiantes con Promesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Búsqueda de Estudiantes por ID</h1>
        <p>Abre la consola del navegador (F12) para ver la ejecución detallada con <code>.then()</code> y <code>.catch()</code>.</p>
        
        <div class="card">
            <label for="studentId">Ingrese el ID del estudiante:</label>
            <div class="input-group">
                <input type="number" id="studentId" placeholder="Ej. 1, 2, 3 o 10">
                <button id="searchBtn">Buscar</button>
            </div>
            <div id="resultContainer" class="result-box">
                
            </div>
        </div>
    </main>

    <script src="02_reto/reto2.js"></script>

</html>
